name: Hapus balasan komentar Pohon Warga
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Tes saja (hitung & cetak balasan yang akan dihapus, TIDAK menghapus)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: pohon-warga-daily
jobs:
  hapus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Hapus balasan sendiri
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/delete-replies.js ${{ inputs.dry && '--dry' || '' }}
      - name: Simpan catatan
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "pohon-warga-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data/replied.json
          git diff --cached --quiet || (git commit -m "Buka lagi komentar untuk dibalas template baru" && git pull --rebase -q && git push)
