name: Terbitkan situs (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['site/**']
  # Commit dari bot "Hari baru" memakai token bawaan dan tidak memicu push-event,
  # jadi situs juga diterbitkan setiap kali workflow harian selesai.
  workflow_run:
    workflows: ['Hari baru Pohon Warga']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # Beri GitHub waktu mendaftarkan artefak sebelum deploy (kadang 'Found 0 artifact(s)')
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
